# ──────────────────────────────────────────────────────────────────────────
#  .github/workflows/cd.yml — Agentic Commerce
#
#  Continuous Deployment pipeline.
#
#  ┌─────────────────────────────────────────────────────────────────┐
#  │  DEPLOYMENT PIPELINE (intended flow once infra is configured)   │
#  │                                                                 │
#  │  GitHub Push to main                                            │
#  │        ↓                                                        │
#  │  CI Tests (ci.yml must pass — enforced via needs:)              │
#  │        ↓                                                        │
#  │  Docker Build & Push → GitHub Container Registry (ghcr.io)     │
#  │        ↓                                                        │
#  │  SSH into Cloud Server                                          │
#  │        ↓                                                        │
#  │  docker compose pull + docker compose up -d                     │
#  │        ↓                                                        │
#  │  Health-check smoke test                                        │
#  └─────────────────────────────────────────────────────────────────┘
#
#  ⚠️  STATUS: PLACEHOLDER — not yet connected to real infrastructure.
#     Configure the GitHub Secrets listed in docs/secrets.md first.
#     Deployment steps are commented out and marked with TODO.
#
#  Trigger: push to main (after CI passes)
# ──────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: [main]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

# Only one deployment at a time per environment
concurrency:
  group: cd-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-commerce-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-commerce-frontend
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

# ──────────────────────────────────────────────────────────────────────────
jobs:

  # ── Gate: CI must pass before CD even starts ─────────────────────────
  ci-gate:
    name: "Gate — CI must pass"
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed
        run: |
          echo "CI gate passed for commit ${{ github.sha }}"
          echo "Proceeding to build & deploy..."

  # ── Build & Push Docker images to GitHub Container Registry ──────────
  build-and-push:
    name: "Docker — Build & Push"
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
      short-sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate with GitHub Container Registry ────────────────
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided — no secret needed for ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image metadata ─────────────────────────────────────
      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      # ── Frontend image metadata ────────────────────────────────────
      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      # ── Build and push backend ─────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build and push frontend ────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            VITE_APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ─────────────────────────────────────────────────
  deploy-staging:
    name: "Deploy — Staging"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.your-domain.com   # TODO: update after infra setup
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── TODO: Uncomment this step once SSH credentials are configured ──
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host:     ${{ secrets.DEPLOY_HOST_STAGING }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key:      ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd ${{ secrets.DEPLOY_PATH }}
      #       echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #       docker compose pull
      #       docker compose up -d --remove-orphans
      #       docker system prune -f

      - name: "⚠️  Deployment not yet configured"
        run: |
          echo "=============================================="
          echo "  STAGING DEPLOY — INFRASTRUCTURE PENDING"
          echo "=============================================="
          echo "Image built and pushed:"
          echo "  Backend:  ${{ needs.build-and-push.outputs.backend-tag }}"
          echo "  Frontend: ${{ needs.build-and-push.outputs.frontend-tag }}"
          echo ""
          echo "Next steps:"
          echo "  1. Provision your cloud server (VPS/EC2/Droplet)"
          echo "  2. Configure GitHub Secrets (see docs/secrets.md)"
          echo "  3. Uncomment the SSH deploy step above"
          echo "=============================================="

  # ── Smoke-test after deploy ───────────────────────────────────────────
  # TODO: Uncomment once staging URL is live
  # smoke-test:
  #   name: "Smoke test — Staging"
  #   runs-on: ubuntu-latest
  #   needs: deploy-staging
  #   steps:
  #     - name: Health check
  #       run: |
  #         curl -fsSL https://staging.your-domain.com/health | jq .
  #         curl -fsSL https://staging.your-domain.com/api/health | jq .

  # ── Notify on failure ─────────────────────────────────────────────────
  notify-failure:
    name: "Notify — Deployment failed"
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: failure()
    steps:
      - name: Print failure notice
        run: |
          echo "CD pipeline failed for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          # TODO: Add Slack/email notification once webhook is configured
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 CD failed for agentic-commerce on ${{ github.ref_name }}"}'
