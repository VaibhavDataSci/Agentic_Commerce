# ──────────────────────────────────────────────────────────────────────────
#  docker-compose.yml — Agentic Commerce / Razorpay AI Buildathon
#
#  Orchestrates all project services locally.
#  Usage:
#    cp .env.example .env          # fill in your real values
#    docker compose up --build     # bring everything up
#    docker compose down -v        # tear down + remove volumes
#
#  Services are intentionally split into named profiles so you can start
#  only what you need:
#    docker compose --profile core up          # backend + frontend + db
#    docker compose --profile messaging up     # adds MQTT broker
#    docker compose --profile infra up         # adds Redis
#    docker compose up                         # everything
# ──────────────────────────────────────────────────────────────────────────

name: agentic-commerce

# ── Shared network ────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ── Named volumes (data persistence) ─────────────────────────────────────
volumes:
  postgres-data:
  redis-data:

# ──────────────────────────────────────────────────────────────────────────
services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ac-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles:
      - core

  # ── Frontend (React + Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_APP_ENV: ${APP_ENV:-development}
    container_name: ac-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network
    profiles:
      - core

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agentic_commerce}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-agentic_commerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - core

  # ── Redis (caching / queues / sessions) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ac-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - infra
      - core

  # ── MQTT Broker (Eclipse Mosquitto — for agentic triggers / IoT) ───────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ac-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "9001:9001"     # WebSocket port for browser clients
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - app-network
    profiles:
      - messaging

  # ─────────────────────────────────────────────────────────────────────
  #  Future services — uncomment and configure when ready:
  #
  #  ai-service:
  #    build:
  #      context: ./services/ai
  #      dockerfile: Dockerfile
  #    ...
  #
  #  agent-simulator:
  #    build:
  #      context: ./services/simulator
  #      dockerfile: Dockerfile
  #    ...
  # ─────────────────────────────────────────────────────────────────────
