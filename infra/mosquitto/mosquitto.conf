# Mosquitto MQTT Broker configuration
# Place this file at: infra/mosquitto/mosquitto.conf

listener 1883
listener 9001
protocol websockets

# Disable anonymous access (set to true for quick local dev)
allow_anonymous false
password_file /mosquitto/config/passwd

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
